# Bench test: get the ESP32 talking to the AXIS A4120-E.
# No lock, no access logic. Flash this first, prove the reader comes online,
# then move to door.yaml.
#
# Open http://reader-test.local (or its IP) for a web page with the sensors
# and test buttons. Logs: `esphome logs reader-test.yaml`
#
# On boot it scans every baud rate and address. Watch the log for
# "FOUND READER: address X at Y baud". If a full pass finds nothing, it says
# how many bytes came back at each baud rate:
#   - 0 bytes everywhere: wiring. 12 V to the reader, common ground,
#     ESP TX->DI, RX<-RO, DE/RE on GPIO4.
#   - Bytes but no valid reply: swap A and B.
# The uart debug lines show the raw bytes either way.

substitutions:
  name: reader-test
  osdp_baud: "9600"
  osdp_address: "0"

esphome:
  name: ${name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

external_components:
  - source: github://jackmmmcneil/esphome-osdp@main
    components: [osdp_cp]

logger:
  level: VERBOSE        # shows LibOSDP's own messages; drop to DEBUG once working
  logs:
    uart_debug: DEBUG
    esp32.preferences: INFO
    scheduler: INFO
    component: INFO

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name} fallback

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    encryption: {}

web_server:
  port: 80
  ota: false

uart:
  id: osdp_bus
  tx_pin: GPIO17
  rx_pin: GPIO16
  # RS-485 DE+RE. The ESP32 UART drives it in hardware (RS-485 half-duplex
  # mode), so it drops the instant the last bit is sent. Delete this line
  # if your RS-485 module switches direction by itself.
  flow_control_pin: GPIO4
  baud_rate: ${osdp_baud}
  # Raw bytes on the wire. OSDP packets start with 0x53 ('S').
  # Remove this block once the reader is online; it's noisy.
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 20ms
    sequence:
      - lambda: UARTDebug::log_hex(direction, bytes, ' ');

osdp_cp:
  id: reader
  uart_id: osdp_bus
  address: ${osdp_address}
  # Probe every baud rate and address on boot and report where the reader
  # answers. Once it logs FOUND READER, copy those values into door.yaml.
  scan: true
  idle_color: amber           # amber idle = "the ESP32 is in control"
  online:
    name: Reader online
  secure_channel:
    name: Reader secure channel
  last_card:
    name: Last card
  on_card:
    - then:
        - logger.log:
            level: INFO
            format: "CARD %s (%d bits)"
            args: [card.c_str(), bits]
        - osdp_cp.led:
            id: reader
            color: green
            duration: 1s
        - osdp_cp.buzzer:
            id: reader
            beeps: 1

# Test only: shows what was typed so you can check every key. Don't keep
# this in a real install, it publishes codes in clear text.
key_collector:
  - id: keypad_test
    source_id: reader
    max_length: 12
    end_keys: "#"
    end_key_required: false
    timeout: 5s
    on_progress:
      - logger.log:
          level: INFO
          format: "KEYS so far: %s"
          args: [x.c_str()]
    on_result:
      - logger.log:
          level: INFO
          format: "KEYS entered: %s"
          args: [x.c_str()]
      - text_sensor.template.publish:
          id: last_keys
          state: !lambda return x;
      - osdp_cp.buzzer:
          id: reader
          beeps: 2
          on_time: 100ms
          off_time: 100ms
    on_timeout:
      - text_sensor.template.publish:
          id: last_keys
          state: !lambda 'return x + " (timeout)";'

text_sensor:
  - platform: template
    id: last_keys
    name: Last keys (test)

button:
  - platform: template
    name: LED green
    on_press:
      - osdp_cp.led: {id: reader, color: green, duration: 3s}
  - platform: template
    name: LED red flash
    on_press:
      - osdp_cp.led:
          id: reader
          color: red
          on_time: 200ms
          off_time: 200ms
          duration: 3s
  - platform: template
    name: LED blue
    on_press:
      - osdp_cp.led: {id: reader, color: blue, duration: 3s}
  - platform: template
    name: Idle LED off
    on_press:
      - osdp_cp.led: {id: reader, color: "off", permanent: true}
  - platform: template
    name: Beep once
    on_press:
      - osdp_cp.buzzer: {id: reader, beeps: 1, on_time: 300ms}
  - platform: template
    name: Beep x3
    on_press:
      - osdp_cp.buzzer: {id: reader, beeps: 3, on_time: 100ms, off_time: 100ms}
  - platform: restart
    name: Restart
