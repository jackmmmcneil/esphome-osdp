name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      - name: Cache test build
        uses: actions/cache@v4
        with:
          path: tests/.build/venv
          key: esphome-venv-${{ hashFiles('tests/run_tests.sh') }}
      - name: Unit, config and end-to-end tests
        run: tests/run_tests.sh --e2e
