name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libssl-dev
      # Cache pip downloads (not the venv: a venv is tied to the interpreter path).
      - name: Cache pip downloads
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('tests/run_tests.sh') }}
      - name: Unit, config and end-to-end tests
        run: tests/run_tests.sh --e2e
